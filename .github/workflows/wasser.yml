name: Wassertemperatur aktualisieren

# Wann der Job laeuft:
on:
  schedule:
    - cron: "0 6 * * *"      # taeglich um 06:00 UTC (~7-8 Uhr in Berlin)
  workflow_dispatch: {}       # erlaubt manuelles Starten per Knopf auf GitHub

# Der Job darf in das Projekt zurueckschreiben:
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wassertemperatur holen
        run: python update_wasser.py

      - name: Aenderung committen (nur wenn sich der Wert geaendert hat)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if ! git diff --quiet wasser.json; then
            git add wasser.json
            git commit -m "Wassertemperatur Schlachtensee aktualisiert"
            git push
          else
            echo "Keine Aenderung – nichts zu tun."
          fi
