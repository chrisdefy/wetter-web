        r.t += dt;
        if (r.t > 0.3) { ringe.splice(i, 1); continue; }
        const rx = 2 + r.t * 34;
        pg.strokeStyle = `rgba(200,225,255,${0.45 * (1 - r.t / 0.3)})`;
        pg.beginPath(); pg.ellipse(r.x, r.y, rx, rx * 0.2, 0, 0, Math.PI * 2); pg.stroke();
      }

      // Schnee
      anpassen(flocken, Math.round(S.schnee * MAX_SCHNEE * qf), neueFlocke, true);
      for (const p of flocken) {
        const yAlt = p.y;
        p.y += (26 + 70 * p.z) * tempo * dt;
        p.x += (S.vx * 90 * (0.4 + p.z) + Math.sin(uZeit * 1.1 + p.ph) * 18 * p.z) * tempo * dt;
        const g = 1.6 + 4.4 * p.z;
        if (p.z > 0.6) {
          const f = trifft(p.x, yAlt, p.y);
          if (f) { if (liegend.length < 240) liegend.push({ el: f.el, dx: p.x - f.l + 12, g, t: 0 }); Object.assign(p, neueFlocke(true)); continue; }
        }
        if (p.y > BH + 10) { Object.assign(p, neueFlocke(true)); continue; }
        pg.globalAlpha = 0.45 + 0.5 * p.z;
        pg.drawImage(flockeBild, p.x - g, p.y - g, g * 2, g * 2);
      }
      for (let i = liegend.length - 1; i >= 0; i--) {
        const l = liegend[i];
        l.t += dt;
        if (l.t > 7) { liegend.splice(i, 1); continue; }
        const f = flaecheVon(l.el);
        if (!f) continue;
        pg.globalAlpha = 0.9 * Math.min(1, (7 - l.t) / 2);
        pg.drawImage(flockeBild, f.l - 12 + l.dx - l.g, f.o - l.g * 0.9, l.g * 2, l.g * 1.4);
      }
      pg.globalAlpha = 1;

      // Hagel springt von den Karten ab
      anpassen(koerner, Math.round(S.hagel * MAX_HAGEL * qf), neuesKorn);
      pg.fillStyle = "rgba(240,248,255,0.9)";
      for (const k of koerner) {
        const yAlt = k.y;
        if (k.b > 0) k.vy += 2600 * dt;
        k.y += k.vy * tempo * dt; k.x += S.vx * 200 * dt;
        if (k.vy > 0) {
          const f = trifft(k.x, yAlt, k.y);
          if (f) { k.y = f.o - 1; k.vy = -k.vy * 0.32; k.b++; if (k.b > 2) Object.assign(k, neuesKorn()); }
        }
        if (k.y > BH + 10) Object.assign(k, neuesKorn());
        pg.beginPath(); pg.arc(k.x, k.y, k.r, 0, Math.PI * 2); pg.fill();
      }
    }

    /* ---------- Zeitleiste: Temperaturkurve zum Spulen ---------- */
    const kurve = $("#kurve"), kg = kurve.getContext("2d");
    let kW = 1, kH = 1, kurveNeu = true, benutzt = false, ziehen = false;
    const KR = { l: 16, r: 16, o: 34, u: 46 };
    function kurveGroesse() {
      const r = kurve.getBoundingClientRect();
      kW = Math.max(1, r.width); kH = Math.max(1, r.height);
      const dp = Math.min(window.devicePixelRatio || 1, 2);
      kurve.width = Math.round(kW * dp); kurve.height = Math.round(kH * dp);
      kg.setTransform(dp, 0, 0, dp, 0, 0);
      kurveNeu = true;
    }
    function zeichneKurve(puls) {
      const d = daten[aktiv];
      kg.clearRect(0, 0, kW, kH);
      if (!d) return;
      const t0 = jetztLokal(d), span = 24 * STD;
      const X = (t) => KR.l + ((t - t0) / span) * (kW - KR.l - KR.r);
      const pts = [];
      const nimm = (t) => { const z = zustandBei(d, (t - t0) / STD); pts.push({ t, v: z.temp, w: z.regenW || 0 }); };
      nimm(t0);
      for (let t = Math.ceil(t0 / STD) * STD; t < t0 + span; t += STD) if (t > t0 + 60000) nimm(t);
      nimm(t0 + span);
      let lo = Infinity, hi = -Infinity;
      for (const p of pts) { lo = Math.min(lo, p.v); hi = Math.max(hi, p.v); }
      if (hi - lo < 4) { const m = (hi + lo) / 2; lo = m - 2; hi = m + 2; }
      const Y = (v) => KR.o + (1 - (v - lo) / (hi - lo)) * (kH - KR.o - KR.u);
      const unten = kH - KR.u;

      // Naechte als dunkle Baender
      const naechte = [[d.unter[0] - TAG, d.auf[0]]];
      for (let k = 0; k < d.auf.length; k++) naechte.push([d.unter[k], k + 1 < d.auf.length ? d.auf[k + 1] : d.auf[k] + TAG]);
      for (const [a, b] of naechte) {
        if (b < t0 || a > t0 + span) continue;
        const xa = X(a), xb = X(b), rand = 26;
        const g = kg.createLinearGradient(xa - rand, 0, xb + rand, 0), w = xb - xa + 2 * rand;
        g.addColorStop(0, "rgba(2,4,22,0)"); g.addColorStop(clamp((2 * rand) / w, 0, 0.5), "rgba(2,4,22,0.32)");
        g.addColorStop(clamp(1 - (2 * rand) / w, 0.5, 1), "rgba(2,4,22,0.32)"); g.addColorStop(1, "rgba(2,4,22,0)");
        kg.fillStyle = g; kg.beginPath();
        if (kg.roundRect) kg.roundRect(xa - rand, 0, w, unten + 14, 12); else kg.rect(xa - rand, 0, w, unten + 14);
        kg.fill();
      }
      // Sonnenauf- und -untergang oben markieren
      kg.font = `500 10px "DM Mono", monospace`;
      kg.textAlign = "center"; kg.textBaseline = "alphabetic";
      for (const [liste, auf] of [[d.auf, true], [d.unter, false]]) {
        for (const t of liste) {
          if (t < t0 || t > t0 + span) continue;
          const x = clamp(X(t), 30, kW - 30);
          kg.fillStyle = "#ffc766";
          kg.beginPath(); kg.arc(x - 20, 12, 3.6, Math.PI, 0); kg.fill();
          kg.fillRect(x - 25, 12.4, 10, 1.2);
          kg.fillText((auf ? "↑ " : "↓ ") + uhr(t), x + 6, 15);
        }
      }
      // Regenwahrscheinlichkeit als Balken
      const bw = Math.max(3, ((kW - KR.l - KR.r) / 24) * 0.55);
      for (const p of pts.slice(1, -1)) {
        if (p.w < 10) continue;
        const h = (p.w / 100) * 20, x = X(p.t);
        kg.fillStyle = `rgba(77,227,255,${0.22 + 0.55 * (p.w / 100)})`;
        kg.beginPath(); kg.roundRect ? kg.roundRect(x - bw / 2, unten + 26 - h, bw, h, 1.5) : kg.rect(x - bw / 2, unten + 26 - h, bw, h); kg.fill();
      }
      // Kurve (weich durch alle Punkte)
      const P = pts.map((p) => [X(p.t), Y(p.v)]);
      const pfad = new Path2D();
      pfad.moveTo(P[0][0], P[0][1]);
      for (let i = 0; i < P.length - 1; i++) {
        const a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], e = P[Math.min(P.length - 1, i + 2)];
        pfad.bezierCurveTo(b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6, c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6, c[0], c[1]);
      }
      const flaeche = new Path2D(pfad);
      flaeche.lineTo(P[P.length - 1][0], unten); flaeche.lineTo(P[0][0], unten); flaeche.closePath();
      const akz = tempFarbe((hi + lo) / 2);
      const fg = kg.createLinearGradient(0, KR.o, 0, unten);
      fg.addColorStop(0, rgba(akz, 0.26)); fg.addColorStop(1, rgba(akz, 0));
      kg.fillStyle = fg; kg.fill(flaeche);
      const sg = kg.createLinearGradient(P[0][0], 0, P[P.length - 1][0], 0);
      pts.forEach((p, i) => sg.addColorStop(clamp((P[i][0] - P[0][0]) / (P[P.length - 1][0] - P[0][0])), rgba(tempFarbe(p.v))));
      kg.lineWidth = 2.6; kg.lineCap = "round"; kg.strokeStyle = sg;
      kg.shadowColor = rgba(akz, 0.55); kg.shadowBlur = 10;
      kg.stroke(pfad);
      kg.shadowBlur = 0;
      // Hoechst- und Tiefstwert beschriften
      let iMax = 0, iMin = 0;
      pts.forEach((p, i) => { if (p.v > pts[iMax].v) iMax = i; if (p.v < pts[iMin].v) iMin = i; });
      kg.font = `500 11px "DM Mono", monospace`;
      kg.fillStyle = "rgba(255,255,255,0.8)";
      kg.fillText(gradText(pts[iMax].v) + "°", clamp(P[iMax][0], 14, kW - 14), P[iMax][1] - 10);
      if (iMin !== iMax) { kg.fillStyle = "rgba(255,255,255,0.6)"; kg.fillText(gradText(pts[iMin].v) + "°", clamp(P[iMin][0], 14, kW - 14), P[iMin][1] + 18); }
      // Stunden-Beschriftung
      kg.font = `400 10.5px "DM Mono", monospace`;
      for (const p of pts.slice(1, -1)) {
        const stunde = new Date(p.t).getUTCHours();
        if (stunde % 3) continue;
        const x = X(p.t);
        if (x < KR.l + 10 || x > kW - KR.r - 10) continue;
        kg.fillStyle = stunde === 0 ? "rgba(255,255,255,0.85)" : "rgba(222,230,255,0.55)";
        kg.fillText(stunde === 0 ? wtag(p.t).toUpperCase() : String(stunde).padStart(2, "0"), x, kH - 4);
      }
      // Abspielkopf
      const tp = t0 + sAnz * STD, xp = X(tp), yp = Y(zustandBei(d, sAnz).temp);
      const lg = kg.createLinearGradient(0, KR.o - 10, 0, unten + 26);
      lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(0.4, "rgba(255,255,255,0.55)"); lg.addColorStop(1, "rgba(255,255,255,0)");
      kg.fillStyle = lg; kg.fillRect(xp - 0.75, KR.o - 10, 1.5, unten + 36 - KR.o);
      if (puls >= 0) {
        kg.strokeStyle = rgba(tempFarbe(zustandBei(d, sAnz).temp), 0.8 * (1 - puls));
        kg.lineWidth = 1.5; kg.beginPath(); kg.arc(xp, yp, 6 + puls * 13, 0, Math.PI * 2); kg.stroke();
      }
      kg.fillStyle = "#fff";
      kg.shadowColor = rgba(tempFarbe(zustandBei(d, sAnz).temp), 0.9); kg.shadowBlur = 14;
      kg.beginPath(); kg.arc(xp, yp, 5.5, 0, Math.PI * 2); kg.fill();
      kg.shadowBlur = 0;
    }

    /* ---------- Oberflaeche ---------- */
    const tabsEl = $("#tabs"), stadtEl = $("#stadt"), landEl = $("#land"), ziffernEl = $("#ziffern");
    const zeileEl = $("#zeile"), ortszeitEl = $("#ortszeit"), zustandEl = $("#zustand"), spanneEl = $("#spanne");
    const statusEl = $("#status"), knopf = $("#knopf"), jetztKnopf = $("#jetzt"), tippEl = $("#tipp");
    let cache = {};
    let pfeilWinkel = 0;

    function zeigeTabs() {
      tabsEl.innerHTML = STAEDTE.map((s, i) => {
        const d = daten[i], c = d && d.roh.current;
        return `<button class="tab" role="tab" type="button" data-i="${i}" aria-selected="${i === aktiv}">`
          + (c ? icon(c.weather_code, c.is_day) : "")
          + `<span>${s.name}</span><span class="t">${c ? gradText(c.temperature_2m) + "°" : ""}</span></button>`;
      }).join("");
    }

    // Der Stadtname steigt Buchstabe fuer Buchstabe aus einer Maske auf.
    function zeigeName(text) {
      stadtEl.innerHTML = "";
      let i = 0;
      for (const wort of text.split(" ")) {
        const w = document.createElement("span");
        w.className = "wort";
        for (const ch of wort) {
          const b = document.createElement("span");
          b.className = "b"; b.textContent = ch; b.style.animationDelay = i++ * 34 + "ms";
          w.append(b);
        }
        stadtEl.append(w, " ");
      }
      stadtEl.setAttribute("aria-label", text);
    }

    // Ziffern rollen wie ein Zaehlwerk: waermer = von unten nach oben.
    function setzeZahl(el, text, hoch) {
      if (el.dataset.v === text) return;
      if (!el.dataset.v) el.textContent = "";
      el.dataset.v = text;
      const zeichen = [...text];
      while (el.children.length < zeichen.length) { const s = document.createElement("span"); s.className = "slot"; el.prepend(s); }
      while (el.children.length > zeichen.length) el.firstElementChild.remove();
      zeichen.forEach((ch, i) => {
        const slot = el.children[i];
        if (slot.dataset.ch === ch) return;
        slot.dataset.ch = ch;
        for (const alt of [...slot.children]) {
          if (alt.classList.contains("weg")) { alt.remove(); continue; }
          alt.classList.add("weg");
          alt.style.transitionDelay = "0ms";
          alt.style.transform = `translateY(${hoch ? -110 : 110}%)`;
          setTimeout(() => alt.remove(), 800);
        }
        const neu = document.createElement("span");
        neu.className = "z"; neu.textContent = ch;
        if (!ruhig) { neu.style.transform = `translateY(${hoch ? 110 : -110}%)`; neu.style.transitionDelay = i * 40 + "ms"; }
        slot.append(neu);
        if (!ruhig) requestAnimationFrame(() => requestAnimationFrame(() => { neu.style.transform = "none"; }));
      });
      el.setAttribute("aria-label", text + " Grad");
    }

    function setzeAkzent(v) {
      const c = tempFarbe(v);
      document.documentElement.style.setProperty("--accent", rgba(c));
      document.documentElement.style.setProperty("--accent-soft", rgba([lerp(c[0], 255, 0.6), lerp(c[1], 255, 0.6), lerp(c[2], 255, 0.6)]));
    }
    const himmelsrichtung = (g) => ["N", "NO", "O", "SO", "S", "SW", "W", "NW"][Math.round(g / 45) % 8];
    function taupunkt(t, rf) {
      const a = 17.62, b = 243.12, g = Math.log(Math.max(rf, 1) / 100) + (a * t) / (b + t);
      return (b * g) / (a - g);
    }
    const setze = (id, html) => { if (cache[id] !== html) { cache[id] = html; document.getElementById(id).innerHTML = html; } };

    function zeigeZustand(info) {
      const d = daten[aktiv], z = info.z, so = info.so;
      const v = Math.round(z.temp), txt = gradText(z.temp);
      if (cache.temp !== txt) {
        setzeZahl(ziffernEl, txt, cache.v == null || v > cache.v);
        cache.v = v; cache.temp = txt;
        setzeAkzent(v);
      }
      const text = (WETTER[z.code] || ["Unbekannt"])[0];
      if (cache.zustand !== text) { cache.zustand = text; zustandEl.textContent = text; }
      const vorschau = sAnz > 0.04;
      zeileEl.classList.toggle("vorschau", vorschau);
      const t = vorschau ? Math.round(z.t / 300000) * 300000 : z.t;
      setze("ortszeit", (vorschau ? "Vorschau · " : "") + wtag(t) + " " + uhr(t) + (vorschau ? "" : " · Ortszeit"));
      const k = clamp(Math.floor((tagesbeginn(z.t) - d.tagT[0]) / TAG), 0, d.tagT.length - 1), dd = d.roh.daily;
      setze("spanne", `H ${gradText(dd.temperature_2m_max[k])}° · T ${gradText(dd.temperature_2m_min[k])}°` + (z.regenW >= 10 ? ` · Regen ${Math.round(z.regenW)} %` : ""));

      // Kacheln
      setze("kGefuehlt", gradText(z.gefuehlt) + "°");
      const diff = z.gefuehlt - z.temp;
      setze("nGefuehlt", diff < -2 ? (z.wind > 15 ? "Der Wind kühlt spürbar" : "Fühlt sich kälter an") : diff > 2 ? "Fühlt sich wärmer an" : "Wie gemessen");
      setze("kWind", Math.round(z.wind) + "<small>km/h</small>");
      setze("nWind", `Böen ${Math.round(z.boeen || z.wind)} · aus ${himmelsrichtung(z.richtung)}`);
      let w = z.richtung + 180, dw = ((w - pfeilWinkel) % 360 + 540) % 360 - 180;
      if (Math.abs(dw) > 0.5) { pfeilWinkel += dw; $("#pfeil").style.transform = `rotate(${pfeilWinkel.toFixed(1)}deg)`; }
      setze("kFeuchte", Math.round(z.feuchte) + "<small>%</small>");
      setze("nFeuchte", `Taupunkt ${gradText(taupunkt(z.temp, z.feuchte))}°`);
      const fb = Math.round(z.feuchte) + "%";
      if (cache.fb !== fb) { cache.fb = fb; $("#bFeuchte").style.width = fb; }
      const [art, zeitpunkt] = so.naechstes;
      setze("lSonne", art);
      setze("kSonne", uhr(zeitpunkt));
      setze("nSonne", `Tageslänge ${Math.floor(so.len)} h ${Math.round((so.len % 1) * 60)} min`);
      const pkt = $("#sonnenPunkt");
      if (so.tag) {
        const x = 50 - 44 * Math.cos(Math.PI * so.p), y = 50 - 44 * Math.sin(Math.PI * so.p);
        pkt.setAttribute("cx", x.toFixed(1)); pkt.setAttribute("cy", y.toFixed(1)); pkt.setAttribute("fill", "var(--gold)");
      } else {
        pkt.setAttribute("cx", (6 + 88 * so.p).toFixed(1)); pkt.setAttribute("cy", "54"); pkt.setAttribute("fill", "rgba(223,230,255,0.5)");
      }
    }

    function zeigeTage() {
      const d = daten[aktiv];
      if (!d) { $("#tage").innerHTML = ""; return; }
      const dd = d.roh.daily, lo = Math.min(...dd.temperature_2m_min), hi = Math.max(...dd.temperature_2m_max), sp = Math.max(1, hi - lo);
      const jetzt = d.roh.current.temperature_2m;
      $("#tage").innerHTML = dd.time.map((iso, i) => {
        const mn = dd.temperature_2m_min[i], mx = dd.temperature_2m_max[i], p = dd.precipitation_probability_max[i] ?? 0;
        const l = ((mn - lo) / sp) * 100, b = ((mx - mn) / sp) * 100;
        const punkt = i === 0 ? `<b style="left:${clamp((jetzt - lo) / sp) * 100}%"></b>` : "";
        return `<div class="tag"><span class="tname">${i === 0 ? "Heute" : wtag(lokal(iso))}</span>${icon(dd.weather_code[i], 1)}`
          + `<span class="tregen">${p >= 10 ? p + "%" : ""}</span><span class="tmin">${gradText(mn)}°</span>`
          + `<span class="spur"><i style="left:${l}%;width:${Math.max(b, 3)}%;background:linear-gradient(90deg,${rgba(tempFarbe(mn))},${rgba(tempFarbe(mx))})"></i>${punkt}</span>`
          + `<span class="tmax">${gradText(mx)}°</span></div>`;
      }).join("");
    }

    // Regionale Wassertemperatur je Stadt. Alle Quellen werden einmal geladen; je Stadt zeigen wir
    // die erste Quelle ihrer Liste, die einen aktuellen Wert hat. Fehlt alles, bleibt die Karte weg.
    let wasserWerte = new Map();
    const quellSchluessel = (q) => (q.quelle === "pegel" ? "p:" + q.id : q.quelle === "meer" ? `m:${q.lat},${q.lon}` : "d:" + q.see);
    const ALT = 2 * TAG;   // aeltere Werte zeigen wir nicht mehr

    async function holeGewaesser(q, datei) {
      if (q.quelle === "datei") {
        const w = await datei;
        const see = w.seen.find((s) => s.ort === q.see);
        if (!see) return null;
        const stand = see.datum || w.stand;   // "datum" steht dabei, wenn der Wert nicht von heute ist
        if (Date.now() - Date.parse(stand + "T12:00:00Z") > ALT + TAG) return null;
        const datum = new Date(stand + "T00:00:00").toLocaleDateString("de-DE", { day: "numeric", month: "long" });
        return { temp: see.temperatur, wann: `Stand ${datum}` };
      }
      if (q.quelle === "pegel") {
        const antwort = await fetch(`https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/${q.id}/WT/currentmeasurement.json`);
        if (!antwort.ok) return null;
        const m = await antwort.json();
        if (m.value == null || Date.now() - Date.parse(m.timestamp) > ALT) return null;
        const wann = new Date(m.timestamp).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
        return { temp: m.value, wann: `${wann} Uhr` };
      }
      const antwort = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${q.lat}&longitude=${q.lon}&current=sea_surface_temperature`);
      if (!antwort.ok) return null;
      const j = await antwort.json();
      return j.current && j.current.sea_surface_temperature != null ? { temp: j.current.sea_surface_temperature, wann: "live" } : null;
    }

    async function ladeWasser() {
      // "?t=" verhindert, dass der Browser eine alte Version zwischenspeichert.
      const datei = fetch("wasser.json?t=" + Date.now()).then((r) => { if (!r.ok) throw new Error(); return r.json(); });
      datei.catch(() => {});
      const quellen = new Map();
      for (const s of STAEDTE) for (const q of s.wasser || []) quellen.set(quellSchluessel(q), q);
      const werte = new Map();
      await Promise.all([...quellen].map(async ([k, q]) => {
        try { const w = await holeGewaesser(q, datei); if (w) werte.set(k, w); } catch (e) { /* Quelle faellt aus: naechste nehmen */ }
      }));
      wasserWerte = werte;
      zeigeWasser();
    }

    function zeigeWasser() {
      const karte = $("#wasserKarte");
      for (const q of STAEDTE[aktiv].wasser || []) {
        const w = wasserWerte.get(quellSchluessel(q));
        if (!w) continue;
        const welle = `<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M3 12c3-3 5-3 8 0s5 3 8 0 5-3 8 0M3 19c3-3 5-3 8 0s5 3 8 0 5-3 8 0" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-linecap="round"/></svg>`;
        $("#gewaesser").innerHTML = `<div class="see">${welle}<div><div class="sname">${q.name}</div><div class="snotiz mono">${q.ort} · ${w.wann}</div></div>`
          + `<div class="stemp" style="color:${rgba(tempFarbe(w.temp))}">${gradText(w.temp)}°</div></div>`;
        karte.hidden = false;
        return;
      }
      karte.hidden = true;  // Kein Gewaesser in der Naehe oder keine Daten: Karte weglassen.
    }

    function waehleStadt(i, ersterStart) {
      aktiv = (i + STAEDTE.length) % STAEDTE.length;
      sZiel = sAnz = 0;
      gleitRate = 1.6; gleitBis = performance.now() + 2200;
      zeigeName(STAEDTE[aktiv].name);
      landEl.textContent = STAEDTE[aktiv].land;
      for (const b of tabsEl.children) b.setAttribute("aria-selected", String(+b.dataset.i === aktiv));
      const tab = tabsEl.children[aktiv];
      if (tab && !ersterStart) tab.scrollIntoView({ behavior: ruhig ? "auto" : "smooth", inline: "center", block: "nearest" });
      const tempAlt = cache.temp, vAlt = cache.v;
      cache = { temp: tempAlt, v: vAlt };
      zeigeTage();
      zeigeWasser();
      kurveNeu = true;
      if (!daten[aktiv] && !ersterStart) { setzeZahl(ziffernEl, "–", true); cache.temp = "–"; zustandEl.textContent = "Keine Daten"; }
    }

    async function ladeAlle() {
      statusEl.textContent = "Lade Daten …";
      knopf.disabled = true;
      let ok = false;
      try {
        const liste = await holeWetter();
        liste.forEach((roh, i) => { if (i < daten.length) daten[i] = bereite(roh); });
        ok = true;
      } catch (e) { /* alte Daten bleiben stehen */ }
      if (ok) {
        const jetzt = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        statusEl.textContent = `Stand ${jetzt} Uhr`;
      } else if (daten.some(Boolean)) {
        statusEl.textContent = "⚠️ Aktualisieren fehlgeschlagen – zeige ältere Daten.";
      } else {
        statusEl.textContent = "⚠️ Keine Verbindung – bitte Internet prüfen.";
        ortszeitEl.textContent = "Keine Verbindung";
      }
      zeigeTabs();
      zeigeTage();
      kurveNeu = true;
      knopf.disabled = false;
    }
    function aktualisiereAlles() { ladeAlle(); ladeWasser(); }

    /* ---------- Bedienung ---------- */
    tabsEl.addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b && +b.dataset.i !== aktiv) waehleStadt(+b.dataset.i); });
    tabsEl.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      waehleStadt(aktiv + (e.key === "ArrowRight" ? 1 : -1));
      tabsEl.children[aktiv].focus();
    });
    knopf.addEventListener("click", aktualisiereAlles);

    // Wischen ueber die grosse Anzeige wechselt die Stadt.
    const hero = $("#hero");
    let wisch = null;
    hero.addEventListener("pointerdown", (e) => { wisch = { x: e.clientX, y: e.clientY }; });
    hero.addEventListener("pointerup", (e) => {
      if (!wisch) return;
      const dx = e.clientX - wisch.x, dy = e.clientY - wisch.y;
      wisch = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) waehleStadt(aktiv + (dx < 0 ? 1 : -1));
    });
    hero.addEventListener("pointercancel", () => { wisch = null; });

    // Ziehen auf der Kurve spult durch die naechsten 24 Stunden.
    function spuleAus(e) {
      const r = kurve.getBoundingClientRect();
      sZiel = clamp((e.clientX - r.left - KR.l) / (r.width - KR.l - KR.r)) * 24;
      if (!benutzt) { benutzt = true; tippEl.classList.add("aus"); }
    }
    kurve.addEventListener("pointerdown", (e) => { ziehen = true; try { kurve.setPointerCapture(e.pointerId); } catch (_) {} spuleAus(e); });
    kurve.addEventListener("pointermove", (e) => { if (ziehen) spuleAus(e); });
    const loslassen = () => { ziehen = false; };
    kurve.addEventListener("pointerup", loslassen);
    kurve.addEventListener("pointercancel", loslassen);
    kurve.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") sZiel = Math.min(24, Math.round(sZiel) + 1);
      else if (e.key === "ArrowLeft") sZiel = Math.max(0, Math.round(sZiel) - 1);
      else if (e.key === "Home") sZiel = 0;
      else if (e.key === "End") sZiel = 24;
      else return;
      e.preventDefault();
      if (!benutzt) { benutzt = true; tippEl.classList.add("aus"); }
    });
    jetztKnopf.addEventListener("click", () => { sZiel = 0; });

    /* ---------- Groesse ---------- */
    function groesse() {
      BW = window.innerWidth; BH = Math.max(window.innerHeight, document.documentElement.clientHeight);
      const lh = himmel.getBoundingClientRect().height;
      if (lh > BH) BH = lh;
      if (gl) {
        const basis = klein ? 0.75 : 0.7, sc = basis * (0.6 + 0.4 * qual) * Math.min(window.devicePixelRatio || 1, 1.5);
        himmel.width = Math.max(2, Math.round(BW * sc)); himmel.height = Math.max(2, Math.round(BH * sc));
      }
      PD = Math.min(window.devicePixelRatio || 1, klein ? 1.5 : 2);
      pc.width = Math.round(BW * PD); pc.height = Math.round(BH * PD);
      kurveGroesse();
      sammleFlaechen();
    }
    window.addEventListener("resize", groesse);
    let flaechenPlan = false;
    window.addEventListener("scroll", () => {
      if (flaechenPlan) return;
      flaechenPlan = true;
      requestAnimationFrame(() => { flaechenPlan = false; sammleFlaechen(); });
    }, { passive: true });

    /* ---------- Hauptschleife ---------- */
    let laufend = false, zuletzt = 0, bild = 0, fpsSumme = 0, fpsN = 0, fpsZeit = 0, flaechenZeit = 0, uhrZeit = 0, pulsZeit = 0;
    const themaMeta = document.querySelector('meta[name="theme-color"]');

    function schritt(jetzt) {
      if (!laufend) return;
      requestAnimationFrame(schritt);
      const rdt = Math.min(0.05, (jetzt - zuletzt) / 1000 || 0.016);
      zuletzt = jetzt;
      bild++;

      // Leistung regeln: wird es ruckelig, rechnet der Himmel mit weniger Pixeln.
      fpsSumme += rdt; fpsN++; fpsZeit += rdt;
      if (fpsZeit > 1.5) {
        const mittel = fpsSumme / fpsN;
        if (mittel > 1 / 40 && qual > 0.6) { qual = Math.max(0.6, qual - 0.15); groesse(); }
        else if (mittel < 1 / 56 && qual < 1) { qual = Math.min(1, qual + 0.05); groesse(); }
        fpsSumme = fpsN = fpsZeit = 0;
      }

      const dt = rdt;
      uZeit += dt * (ruhig ? 0.15 : 1);
      drift += S.vx * 0.03 * dt * (ruhig ? 0.15 : 1) + 0.002 * dt;

      // Spulen: beim Ziehen direkt, bei "Jetzt" weich zurueck
      const sAlt = sAnz;
      sAnz += (sZiel - sAnz) * (1 - Math.exp(-dt * (ziehen ? 14 : 5)));
      if (Math.abs(sZiel - sAnz) < 0.002) sAnz = sZiel;
      if (sAnz !== sAlt) kurveNeu = true;
      jetztKnopf.hidden = sZiel < 0.04;

      const d = daten[aktiv];
      let info = null;
      if (d) {
        info = ziel(d, sAnz);
        T = info.S;
        mondWinkel = info.phase * Math.PI * 2;
        halbkugel = STAEDTE[aktiv].lat >= 0 ? 1 : -1;
        zeigeZustand(info);
      }
      const rate = performance.now() < gleitBis ? gleitRate : 5;
      const k = 1 - Math.exp(-dt * rate);
      let unruhe = 0;
      for (const key in S) { const dd = T[key] - S[key]; S[key] += dd * k; unruhe = Math.max(unruhe, Math.abs(dd)); }

      // Himmel: bei ruhiger Szene reicht jedes zweite Bild (Wolken ziehen langsam)
      if (gl && (unruhe > 0.004 || blitzHell > 0.01 || bild % 2 === 0)) zeichneHimmel();
      else if (!gl && bild % 15 === 0) rueckfallHimmel();
      partikel(dt);

      flaechenZeit += dt;
      if (flaechenZeit > 0.7) { flaechenZeit = 0; sammleFlaechen(); }
      uhrZeit += dt;
      if (uhrZeit > 20) { uhrZeit = 0; kurveNeu = true; }
      let puls = -1;
      if (!benutzt && !ruhig) { pulsZeit += dt; puls = (pulsZeit % 2.2) / 2.2; if (bild % 2 === 0) kurveNeu = true; }
      if (kurveNeu) { kurveNeu = false; zeichneKurve(puls); }
      if (bild % 60 === 0 && themaMeta) {
        const tag = glatt(-0.12, 0.22, S.se);
        themaMeta.setAttribute("content", rgba([lerp(3, 31, tag) * (1 - S.wolke * 0.3), lerp(5, 80, tag) * (1 - S.wolke * 0.3), lerp(16, 180, tag) * (1 - S.wolke * 0.3)]));
      }
    }
    function starte() {
      if (laufend) return;
      laufend = true;
      zuletzt = performance.now();
      requestAnimationFrame(schritt);
    }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) laufend = false;
      else { starte(); if (Date.now() - geladenUm > 15 * 60000) { geladenUm = Date.now(); aktualisiereAlles(); } }
    });
    let geladenUm = Date.now();
    setInterval(() => { if (!document.hidden) { geladenUm = Date.now(); aktualisiereAlles(); } }, 15 * 60000);

    /* ---------- Start ---------- */
    if (!starteGL()) rueckfallHimmel();
    zeigeTabs();
    groesse();
    waehleStadt(0, true);
    starte();
    aktualisiereAlles();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { kurveNeu = true; });

    // Nur fuer Tests: mit window.__WETTER_DEBUG = true vor dem Laden lassen sich Wetter und Zeit vorgeben.
    if (window.__WETTER_DEBUG) {
      window.__wetter = {
        stadt: (i) => waehleStadt(i),
        spule: (h) => { sZiel = h; },
        wetter: (code, o = {}) => { debug = { code, ...o }; },
        echt: () => { debug = null; },
        sofort: () => { if (daten[aktiv]) { Object.assign(S, ziel(daten[aktiv], sZiel).S); sAnz = sZiel; gleitBis = 0; } },
        blitz: () => { blitzObj = neuerBlitz(); },
        zustand: () => ({ S: { ...S }, qual, gl: !!gl, aktiv, geladen: daten.map(Boolean) }),
      };
    }
  })();
  </script>
